[package]
name = "happy-wakey-web-common"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-nats = { version = "0.50", default-features = false, features = ["jetstream", "nkeys", "ring", "server_2_10"] }
axum.workspace = true
bytes = "1"
flags2env.workspace = true
futures-util = "0.3"
happy-wakey-interfaces = { git = "https://github.com/happy-wakey/happy-wakey-interfaces.git", rev = "35b25d5b49cfd469d633914993450c62f25b36b8" }
happy-wakey-lib-core = { git = "https://github.com/happy-wakey/happy-wakey-lib-core.git", rev = "f6f159ab5d3d5a5d7cca9b279e7fdc7924091a21", default-features = false, features = ["read-only"] }
happy-wakey-pub-lib-core = { git = "https://github.com/happy-wakey/happy-wakey-pub-lib-core.git", rev = "14a35640992ea2daed788e7ed5c0ef19c18b8c7b" }
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "ca176fb6768a9750d262a536952268625ffd3a8a" }
ores-middleware = { git = "https://github.com/ORESoftware/ores-middleware.git", rev = "6f73bf1ae97f38f05e2e87e4eb3e0e18e0142529", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rustls-pemfile = "2"
serde.workspace = true
serde_json.workspace = true
syncer-rs = { git = "https://github.com/opto-sync/syncer.rs.git", rev = "f8dfef90722dc423d442388f61856958a177d36f" }
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1", features = ["v4"] }
